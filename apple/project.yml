# XcodeGen spec for the Mac and iPhone apps. Regenerate with `xcodegen generate` in apple/ and
# commit the result: CI fails when FamilyOffice.xcodeproj or either Info.plist differ from this spec.
name: FamilyOffice
options:
  bundleIdPrefix: com.familyoffice
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Apple Silicon and Intel.
    ARCHS: $(ARCHS_STANDARD)
    DEAD_CODE_STRIPPING: YES
packages:
  FOKit:
    path: FOKit
  # The embedded terminal (Terminal/FoTerminalView). MIT; pinned to an exact release. 1.11 and later
  # add a SwiftPM build-tool plugin, which xcodebuild refuses without skipping plugin validation.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.1
targets:
  FamilyOffice:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: FamilyOffice
        excludes:
          - Info.plist
    dependencies:
      - package: FOKit
        product: FOKit
      - package: SwiftTerm
        product: SwiftTerm
    info:
      path: FamilyOffice/Info.plist
      properties:
        CFBundleDisplayName: Family Office
        CFBundleName: Family Office
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: MIT License
        NSPrincipalClass: NSApplication
        # The family-office package version the bundled `fo --version` must report.
        FOExpectedVersion: 2.0.0a1
        # The web view talks to fo serve over plain HTTP on 127.0.0.1 only.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: FamilyOffice
        PRODUCT_BUNDLE_IDENTIFIER: com.familyoffice.app
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        # The copy phase below reads apple/Resources/fo, outside the declared inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Copy bundled Python runtime
        basedOnDependencyAnalysis: false
        showEnvVars: false
        shell: /bin/sh
        script: |
          # Copies apple/Resources/fo (built by Scripts/bundle-python.sh) into
          # Contents/Resources/fo when it exists. Without it, development builds use
          # FO_EXECUTABLE or the foExecutablePath user default instead.
          set -eu
          src="${SRCROOT}/Resources/fo"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/fo"
          if [ -x "$src/bin/fo" ]; then
            mkdir -p "$dst"
            rsync -a --delete "$src/" "$dst/"
          else
            rm -rf "$dst"
            echo "note: apple/Resources/fo not found; building without the bundled runtime."
          fi
  FamilyOfficePhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FamilyOfficePhone
        excludes:
          - Info.plist
    # FOKit only: the phone app has no third-party dependencies and no entitlements.
    dependencies:
      - package: FOKit
        product: FOKit
    info:
      path: FamilyOfficePhone/Info.plist
      properties:
        CFBundleDisplayName: Family Office
        CFBundleName: Family Office
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Family Office uses the camera only to scan the pairing code your Mac shows.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The Mac is reached over HTTPS on its tailnet name. Plain HTTP is allowed only for
        # local names, which a simulator uses to reach a server on the same Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: FamilyOfficePhone
        PRODUCT_BUNDLE_IDENTIFIER: com.familyoffice.phone
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 1
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  FamilyOfficePhoneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FamilyOfficePhoneTests
    dependencies:
      - target: FamilyOfficePhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familyoffice.phone.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  FamilyOffice:
    build:
      targets:
        FamilyOffice: all
    run:
      config: Debug
    archive:
      config: Release
  FamilyOfficePhone:
    build:
      targets:
        FamilyOfficePhone: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FamilyOfficePhoneTests
    archive:
      config: Release
