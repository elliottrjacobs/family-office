# Build, sign, notarize and publish the Mac app. See RELEASING.md.
#
# Every step that needs a secret is skipped, with a notice saying so, when that secret is absent,
# so a fork (or a repository before the one-time setup) still produces ad-hoc signed DMGs as
# workflow artifacts and attaches them to a draft release.
#
# Signing secrets live in the `release` environment and only the build job reads them; the
# publish job holds the write token and no secret. Actions are pinned by commit SHA.
name: Release Mac app
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose release receives the assets (empty to build artifacts only)
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false
env:
  # Sparkle's release tools (generate_appcast), pinned with the SHA-256 GitHub reports for the asset.
  SPARKLE_VERSION: 2.10.1
  SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
jobs:
  build:
    # Apple Silicon only: cryptography (a locked dependency of the bundled runtime) publishes no
    # Intel macOS wheels, so an x86_64 bundle cannot be built from the lock.
    name: Build arm64
    runs-on: macos-latest
    # Every signing secret lives in this environment; it is the only job that reads them.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: brew install xcodegen

      - name: Check secrets
        id: secrets
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          if [ -n "$MAC_CERT_P12" ] && [ -n "$MAC_CERT_PASSWORD" ]; then
            echo "sign=true" >>"$GITHUB_OUTPUT"
          else
            echo "sign=false" >>"$GITHUB_OUTPUT"
            echo "::notice::MAC_CERT_P12 or MAC_CERT_PASSWORD is not set: signing ad-hoc. The DMG will not pass Gatekeeper and is not for distribution."
          fi
          if [ -n "$MAC_CERT_P12" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ] && [ -n "$NOTARY_KEY_P8" ]; then
            echo "notarize=true" >>"$GITHUB_OUTPUT"
          else
            echo "notarize=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Notarization skipped: it needs MAC_CERT_P12 and NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8."
          fi

      - name: Version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            marketing="${GITHUB_REF_NAME#v}"
            tag="$GITHUB_REF_NAME"
          else
            marketing="$(sed -n 's/^ *MARKETING_VERSION: *//p' apple/project.yml | head -1)"
            tag="$INPUT_TAG"
          fi
          # The tag reaches xcodebuild and the release, so accept only a plain version.
          if ! [[ "$marketing" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Version '$marketing' is not N.N.N with an optional a/b/rc suffix."
            exit 1
          fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vN.N.N with an optional a/b/rc suffix."
            exit 1
          fi
          {
            echo "MARKETING_VERSION=$marketing"
            echo "RELEASE_TAG=$tag"
            # Sparkle compares CFBundleVersion, which must grow with every release.
            echo "BUILD_NUMBER=$(git rev-list --count HEAD)"
          } >>"$GITHUB_ENV"

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Bundle Python
        env:
          FO_BUNDLE_ARCH: arm64
        run: apple/Scripts/bundle-python.sh

      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate

      - name: Archive
        # Unsigned here; sign-bundle.sh signs every Mach-O in one pass below.
        run: |
          xcodebuild archive \
            -project apple/FamilyOffice.xcodeproj -scheme FamilyOffice -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/FamilyOffice.xcarchive" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          echo "APP=$RUNNER_TEMP/FamilyOffice.xcarchive/Products/Applications/FamilyOffice.app" >>"$GITHUB_ENV"

      - name: Import the Developer ID certificate
        if: steps.secrets.outputs.sign == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MAC_CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" \
            "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in MAC_CERT_P12."
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Sign
        run: apple/Scripts/sign-bundle.sh "$APP" "${SIGN_IDENTITY:--}"

      - name: Bundled fo runs after signing
        run: |
          "$APP/Contents/Resources/fo/bin/fo" --version
          "$APP/Contents/Resources/fo/bin/fo" serve --help >/dev/null

      - name: Write the notarization key
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"

      - name: Notarize and staple the app
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
        run: |
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/FamilyOffice.zip"
          apple/Scripts/notarize.sh "$RUNNER_TEMP/FamilyOffice.zip"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vv "$APP"

      - name: Build the DMG
        run: |
          dmg="$(apple/Scripts/make-dmg.sh "$APP" "${SIGN_IDENTITY:--}" "$RUNNER_TEMP/dmg" | tail -1)"
          echo "DMG=$dmg" >>"$GITHUB_ENV"

      - name: Notarize and staple the DMG
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
        run: |
          apple/Scripts/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Sign the appcast
        if: env.RELEASE_TAG != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/appcast"
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::notice::SPARKLE_PRIVATE_KEY is not set: no appcast is generated, so installed apps will not see this release."
            exit 0
          fi
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools" "$RUNNER_TEMP/appcast-in"
          curl -fsSL --retry 3 -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $tools/sparkle.tar.xz" | shasum -a 256 -c
          tar -xJf "$tools/sparkle.tar.xz" -C "$tools"
          cp "$DMG" "$RUNNER_TEMP/appcast-in/"
          prefix="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tools/bin/generate_appcast" --ed-key-file - \
            --download-url-prefix "$prefix" -o "$RUNNER_TEMP/appcast/appcast.xml" "$RUNNER_TEMP/appcast-in"
          ls -l "$RUNNER_TEMP/appcast/appcast.xml"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-arm64
          path: ${{ env.DMG }}
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.RELEASE_TAG != ''
        with:
          name: appcast
          path: ${{ runner.temp }}/appcast
          if-no-files-found: ignore

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

  publish:
    # Holds the write token but no signing secret; it only attaches what the build job made.
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vN.N.N with an optional a/b/rc suffix."
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "::notice::No tag: the DMG stays a workflow artifact and no release is touched."
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.tag.outputs.tag != ''
        with:
          path: artifacts

      - name: Attach to the release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes "Draft created by the Mac release workflow. Edit the notes, then publish."
          fi
          gh release upload "$TAG" artifacts/dmg-arm64/*.dmg --clobber
          if [ -f artifacts/appcast/appcast.xml ]; then
            gh release upload "$TAG" artifacts/appcast/appcast.xml --clobber
          fi
