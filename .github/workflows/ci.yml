name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=fo --cov-report=term-missing:skip-covered --cov-fail-under=78
      - run: uv run python scripts/lint_office_paths.py
      - run: uv run python scripts/lint_identifiers.py
      - run: uv run python scripts/lint_skills.py skills/ AGENTS.md
      - run: uv build
      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Committed build matches app/
        working-directory: .
        run: |
          changes="$(git status --porcelain -- src/fo/data/app)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "Run npm run build in app/ and commit src/fo/data/app."
            exit 1
          fi
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Committed Xcode project matches project.yml
        working-directory: apple
        run: |
          xcodegen generate
          git diff --exit-code FamilyOffice.xcodeproj FamilyOffice/Info.plist FamilyOfficePhone/Info.plist
      - name: FOKit
        working-directory: apple/FOKit
        run: |
          swift build
          swift test
      - name: Mac app
        run: >-
          xcodebuild -project apple/FamilyOffice.xcodeproj -scheme FamilyOffice
          -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: iPhone app
        run: >-
          xcodebuild -project apple/FamilyOffice.xcodeproj -scheme FamilyOfficePhone
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: iPhone app tests
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, group in devices.items() if "iOS" in runtime
                     for d in group if d["name"].startswith("iPhone")))')"
          xcodebuild -project apple/FamilyOffice.xcodeproj -scheme FamilyOfficePhone \
            -destination "id=$udid" CODE_SIGNING_ALLOWED=NO test
